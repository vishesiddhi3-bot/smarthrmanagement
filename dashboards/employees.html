<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartHR | Employee Management</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        .page {
            min-height: 100vh;
        }

        /* ==============================
           TOPBAR
        ============================== */

        .topbar {
            height: 75px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand strong {
            font-size: 20px;
        }

        .brand small {
            display: block;
            color: #64748b;
            margin-top: 2px;
        }

        .back-btn {
            border: none;
            background: #eef2ff;
            color: #2563eb;
            padding: 10px 16px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 600;
        }

        /* ==============================
           CONTENT
        ============================== */

        .content {
            padding: 30px 35px;
        }

        .heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .heading h1 {
            font-size: 28px;
        }

        .heading p {
            color: #64748b;
            margin-top: 6px;
        }

        .add-btn {
            border: none;
            background: #2563eb;
            color: white;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        .add-btn:hover {
            background: #1d4ed8;
        }

        /* ==============================
           CARD
        ============================== */

        .card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 4px 18px rgba(0,0,0,.05);
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1050px;
        }

        th,
        td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #edf0f4;
        }

        th {
            background: #f8fafc;
            color: #475569;
            font-size: 13px;
        }

        td {
            font-size: 14px;
        }

        /* ==============================
           STATUS
        ============================== */

        .status {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .active {
            background: #dcfce7;
            color: #15803d;
        }

        .inactive {
            background: #fee2e2;
            color: #b91c1c;
        }

        /* ==============================
           ACTION BUTTON
        ============================== */

        .action-btn {
            border: none;
            padding: 8px 12px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 600;
        }

        .edit-btn {
            background: #eff6ff;
            color: #2563eb;
        }

        .edit-btn:hover {
            background: #dbeafe;
        }

        /* ==============================
           EMPTY
        ============================== */

        .empty {
            text-align: center;
            color: #64748b;
            padding: 35px;
        }

        /* ==============================
           MODAL
        ============================== */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, .55);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-box {
            background: white;
            width: 100%;
            max-width: 850px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 18px;
            padding: 28px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .modal-header h2 {
            font-size: 22px;
        }

        .close-btn {
            border: none;
            background: #f1f5f9;
            width: 35px;
            height: 35px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
        }

        /* ==============================
           FORM
        ============================== */

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: #374151;
        }

        input,
        select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #dbe1e8;
            border-radius: 9px;
            outline: none;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,.1);
        }

        /* ==============================
           EMAIL INFO
        ============================== */

        .email-info {
            display: none;
            padding: 10px 12px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 9px;
            color: #475569;
            font-size: 14px;
        }

        /* ==============================
           MODAL ACTIONS
        ============================== */

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
        }

        .cancel-btn,
        .save-btn {
            border: none;
            padding: 11px 18px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 600;
        }

        .cancel-btn {
            background: #f1f5f9;
            color: #475569;
        }

        .save-btn {
            background: #2563eb;
            color: white;
        }

        .save-btn:hover {
            background: #1d4ed8;
        }

        /* ==============================
           MESSAGE
        ============================== */

        .message {
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: 600;
        }

        /* ==============================
           RESPONSIVE
        ============================== */

        @media (max-width: 700px) {

            .content {
                padding: 20px;
            }

            .topbar {
                padding: 0 20px;
            }

            .heading {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

        }

    </style>

</head>


<body>


<div class="page">


    <!-- ==========================================
         TOPBAR
    =========================================== -->

    <header class="topbar">

        <div class="brand">

            <div class="brand-icon">
                <i class="fa-solid fa-users"></i>
            </div>

            <div>

                <strong>SmartHR</strong>

                <small>
                    Employee Management
                </small>

            </div>

        </div>


        <button
            class="back-btn"
            onclick="goBack()"
        >

            <i class="fa-solid fa-arrow-left"></i>

            Dashboard

        </button>

    </header>



    <!-- ==========================================
         MAIN CONTENT
    =========================================== -->

    <main class="content">


        <div class="heading">

            <div>

                <h1>
                    Employees
                </h1>

                <p>
                    Manage employee information
                </p>

            </div>


            <button
                class="add-btn"
                id="openAddEmployee"
            >

                <i class="fa-solid fa-user-plus"></i>

                Add Employee

            </button>

        </div>



        <!-- ==========================================
             EMPLOYEE TABLE
        =========================================== -->

        <div class="card">

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Employee ID
                            </th>

                            <th>
                                Name
                            </th>

                            <th>
                                Email
                            </th>

                            <th>
                                Phone
                            </th>

                            <th>
                                Department
                            </th>

                            <th>
                                Designation
                            </th>

                            <th>
                                Joining Date
                            </th>

                            <th>
                                Salary
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Actions
                            </th>

                        </tr>

                    </thead>


                    <tbody id="employeeTableBody">

                        <tr>

                            <td
                                colspan="10"
                                class="empty"
                            >

                                Loading employees...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </main>


</div>



<!-- ==========================================
     EMPLOYEE MODAL
=========================================== -->

<div
    class="modal"
    id="employeeModal"
>

    <div class="modal-box">


        <div class="modal-header">

            <h2 id="modalTitle">

                <i class="fa-solid fa-user-plus"></i>

                Add New Employee

            </h2>


            <button
                class="close-btn"
                id="closeModal"
            >
                ×
            </button>

        </div>



        <div
            class="message"
            id="formMessage"
        ></div>



        <form id="employeeForm">


            <div class="form-grid">


                <!-- FIRST NAME -->

                <div class="form-group">

                    <label>
                        First Name *
                    </label>

                    <input
                        type="text"
                        id="firstName"
                        required
                    >

                </div>



                <!-- LAST NAME -->

                <div class="form-group">

                    <label>
                        Last Name *
                    </label>

                    <input
                        type="text"
                        id="lastName"
                        required
                    >

                </div>



                <!-- EMAIL -->

                <div class="form-group">

                    <label>
                        Email *
                    </label>

                    <!-- ADD MODE -->

                    <input
                        type="email"
                        id="email"
                        required
                    >

                    <!-- EDIT MODE -->

                    <div
                        class="email-info"
                        id="editEmailInfo"
                    ></div>

                </div>



                <!-- PHONE -->

                <div class="form-group">

                    <label>
                        Phone *
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        required
                    >

                </div>



                <!-- DEPARTMENT -->

                <div class="form-group">

                    <label>
                        Department *
                    </label>

                    <select
                        id="department"
                        required
                    >

                        <option value="">
                            Select Department
                        </option>

                        <option value="IT">
                            IT
                        </option>

                        <option value="HR">
                            HR
                        </option>

                        <option value="Finance">
                            Finance
                        </option>

                        <option value="Marketing">
                            Marketing
                        </option>

                        <option value="Sales">
                            Sales
                        </option>

                        <option value="Operations">
                            Operations
                        </option>

                    </select>

                </div>



                <!-- DESIGNATION -->

                <div class="form-group">

                    <label>
                        Designation *
                    </label>

                    <input
                        type="text"
                        id="designation"
                        placeholder="Example: Software Developer"
                        required
                    >

                </div>



                <!-- JOINING DATE -->

                <div class="form-group">

                    <label>
                        Joining Date *
                    </label>

                    <input
                        type="date"
                        id="joiningDate"
                        required
                    >

                </div>



                <!-- SALARY -->

                <div class="form-group">

                    <label>
                        Salary *
                    </label>

                    <input
                        type="number"
                        id="salary"
                        min="0"
                        placeholder="Example: 35000"
                        required
                    >

                </div>



                <!-- STATUS -->

                <div class="form-group">

                    <label>
                        Status *
                    </label>

                    <select
                        id="status"
                        required
                    >

                        <option value="active">
                            Active
                        </option>

                        <option value="inactive">
                            Inactive
                        </option>

                    </select>

                </div>


            </div>



            <!-- MODAL BUTTONS -->

            <div class="modal-actions">


                <button
                    type="button"
                    class="cancel-btn"
                    id="cancelModal"
                >

                    Cancel

                </button>



                <button
                    type="submit"
                    class="save-btn"
                    id="saveBtn"
                >

                    <i class="fa-solid fa-check"></i>

                    Save Employee

                </button>


            </div>


        </form>

    </div>

</div>



<script>


// ==========================================
// API
// ==========================================

const API_URL =
    "http://localhost:5000/api/employees";


// ==========================================
// ELEMENTS
// ==========================================

const modal =
    document.getElementById(
        "employeeModal"
    );

const openBtn =
    document.getElementById(
        "openAddEmployee"
    );

const closeBtn =
    document.getElementById(
        "closeModal"
    );

const cancelBtn =
    document.getElementById(
        "cancelModal"
    );

const form =
    document.getElementById(
        "employeeForm"
    );

const tableBody =
    document.getElementById(
        "employeeTableBody"
    );

const message =
    document.getElementById(
        "formMessage"
    );

const modalTitle =
    document.getElementById(
        "modalTitle"
    );

const saveBtn =
    document.getElementById(
        "saveBtn"
    );

const emailInput =
    document.getElementById(
        "email"
    );

const editEmailInfo =
    document.getElementById(
        "editEmailInfo"
    );


// ==========================================
// EDIT MODE
// ==========================================

let editEmployeeId = null;


// ==========================================
// BACK BUTTON
// ==========================================

function goBack() {

    window.location.href =
        "admin.html";

}


// ==========================================
// OPEN ADD MODAL
// ==========================================

function openAddModal() {

    editEmployeeId = null;

    form.reset();

    message.textContent = "";

    message.style.color = "";

    modalTitle.innerHTML = `
        <i class="fa-solid fa-user-plus"></i>
        Add New Employee
    `;

    saveBtn.innerHTML = `
        <i class="fa-solid fa-check"></i>
        Save Employee
    `;

    emailInput.style.display =
        "block";

    emailInput.disabled =
        false;

    editEmailInfo.style.display =
        "none";

    editEmailInfo.textContent =
        "";

    modal.classList.add(
        "show"
    );

}


// ==========================================
// CLOSE MODAL
// ==========================================

function closeModal() {

    modal.classList.remove(
        "show"
    );

    editEmployeeId = null;

}


// ==========================================
// BUTTON EVENTS
// ==========================================

openBtn.addEventListener(
    "click",
    openAddModal
);

closeBtn.addEventListener(
    "click",
    closeModal
);

cancelBtn.addEventListener(
    "click",
    closeModal
);


// ==========================================
// LOAD EMPLOYEES
// ==========================================

async function loadEmployees() {

    try {

        const response =
            await fetch(
                API_URL
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Unable to load employees"
            );

        }


        const employees =
            Array.isArray(
                data.employees
            )
                ? data.employees
                : [];


        if (
            employees.length === 0
        ) {

            tableBody.innerHTML = `
                <tr>

                    <td
                        colspan="10"
                        class="empty"
                    >
                        No employees found.
                    </td>

                </tr>
            `;

            return;

        }


        tableBody.innerHTML =
            employees.map(
                function(employee) {


                    const fullName =
                        (
                            employee.first_name ||
                            ""
                        ) +
                        " " +
                        (
                            employee.last_name ||
                            ""
                        );


                    const status =
                        String(
                            employee.status ||
                            ""
                        ).toLowerCase();


                    return `

                        <tr>

                            <td>

                                ${escapeHTML(
                                    employee.employee_code ||
                                    "-"
                                )}

                            </td>


                            <td>

                                <strong>

                                    ${escapeHTML(
                                        fullName.trim() ||
                                        "-"
                                    )}

                                </strong>

                            </td>


                            <td>

                                ${escapeHTML(
                                    employee.email ||
                                    "-"
                                )}

                            </td>


                            <td>

                                ${escapeHTML(
                                    employee.phone ||
                                    "-"
                                )}

                            </td>


                            <td>

                                ${escapeHTML(
                                    employee.department ||
                                    "-"
                                )}

                            </td>


                            <td>

                                ${escapeHTML(
                                    employee.designation ||
                                    "-"
                                )}

                            </td>


                            <td>

                                ${
                                    employee.joining_date
                                        ? formatDate(
                                            employee.joining_date
                                        )
                                        : "-"
                                }

                            </td>


                            <td>

                                ₹${Number(
                                    employee.salary ||
                                    0
                                ).toLocaleString(
                                    "en-IN"
                                )}

                            </td>


                            <td>

                                <span
                                    class="status ${
                                        status === "active"
                                            ? "active"
                                            : "inactive"
                                    }"
                                >

                                    ${
                                        status === "active"
                                            ? "Active"
                                            : "Inactive"
                                    }

                                </span>

                            </td>


                            <td>

                                <button
                                    class="action-btn edit-btn"
                                    onclick="editEmployee(
                                        ${Number(employee.id)}
                                    )"
                                >

                                    <i class="fa-solid fa-pen"></i>

                                    Edit

                                </button>

                            </td>

                        </tr>

                    `;

                }
            ).join("");


    }
    catch(error) {

        console.error(
            "LOAD EMPLOYEES ERROR:",
            error
        );


        tableBody.innerHTML = `
            <tr>

                <td
                    colspan="10"
                    class="empty"
                >

                    Cannot connect to SmartHR server.

                </td>

            </tr>
        `;

    }

}


// ==========================================
// EDIT EMPLOYEE
// ==========================================

async function editEmployee(
    employeeId
) {

    try {

        message.textContent =
            "Loading employee...";

        message.style.color =
            "#2563eb";


        const response =
            await fetch(
                `${API_URL}/${employeeId}`
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Unable to load employee"
            );

        }


        const employee =
            data.employee;


        // ==================================
        // SET EDIT MODE
        // ==================================

        editEmployeeId =
            employee.id;


        modalTitle.innerHTML = `
            <i class="fa-solid fa-user-pen"></i>
            Edit Employee
        `;


        saveBtn.innerHTML = `
            <i class="fa-solid fa-floppy-disk"></i>
            Update Employee
        `;


        // ==================================
        // FILL FORM
        // ==================================

        document.getElementById(
            "firstName"
        ).value =
            employee.first_name ||
            "";


        document.getElementById(
            "lastName"
        ).value =
            employee.last_name ||
            "";


        document.getElementById(
            "phone"
        ).value =
            employee.phone ||
            "";


        document.getElementById(
            "department"
        ).value =
            employee.department ||
            "";


        document.getElementById(
            "designation"
        ).value =
            employee.designation ||
            "";


        document.getElementById(
            "joiningDate"
        ).value =
            getDateForInput(
                employee.joining_date
            );


        document.getElementById(
            "salary"
        ).value =
            employee.salary ||
            0;


        document.getElementById(
            "status"
        ).value =
            employee.status ||
            "active";


        // ==================================
        // EMAIL
        // ==================================
        // Email is NOT editable here
        // because it is the login identity.

        emailInput.value =
            employee.email ||
            "";

        emailInput.style.display =
            "none";

        emailInput.required =
            false;

        editEmailInfo.style.display =
            "block";

        editEmailInfo.innerHTML = `
            <strong>Login Email:</strong>
            ${escapeHTML(
                employee.email ||
                "-"
            )}
            <br>
            <small>
                Email and password are not changed from here.
            </small>
        `;


        message.textContent =
            "";


        modal.classList.add(
            "show"
        );


    }
    catch(error) {

        console.error(
            "EDIT EMPLOYEE ERROR:",
            error
        );


        alert(
            error.message ||
            "Unable to load employee"
        );

    }

}


// ==========================================
// FORM SUBMIT
// ==========================================

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        // ==================================
        // EDIT EMPLOYEE
        // ==================================

        if (
            editEmployeeId !== null
        ) {

            await updateEmployee();

            return;

        }


        // ==================================
        // ADD EMPLOYEE
        // ==================================

        await addEmployee();

    }
);


// ==========================================
// ADD EMPLOYEE
// ==========================================

async function addEmployee() {

    message.textContent =
        "Creating employee...";

    message.style.color =
        "#2563eb";


    const employeeData = {

        firstName:
            document.getElementById(
                "firstName"
            ).value.trim(),

        lastName:
            document.getElementById(
                "lastName"
            ).value.trim(),

        email:
            document.getElementById(
                "email"
            ).value.trim(),

        phone:
            document.getElementById(
                "phone"
            ).value.trim(),

        department:
            document.getElementById(
                "department"
            ).value,

        designation:
            document.getElementById(
                "designation"
            ).value.trim(),

        joiningDate:
            document.getElementById(
                "joiningDate"
            ).value,

        salary:
            Number(
                document.getElementById(
                    "salary"
                ).value
            ),

        status:
            document.getElementById(
                "status"
            ).value

    };


    try {

        const response =
            await fetch(
                API_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            employeeData
                        )
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Employee creation failed"
            );

        }


        message.textContent =
            "✅ Employee created successfully!";

        message.style.color =
            "#15803d";


        await loadEmployees();


        setTimeout(
            function() {

                closeModal();

                form.reset();

            },
            1000
        );


    }
    catch(error) {

        console.error(
            "CREATE EMPLOYEE ERROR:",
            error
        );


        message.textContent =
            "❌ " +
            (
                error.message ||
                "Unable to create employee"
            );

        message.style.color =
            "#dc2626";

    }

}


// ==========================================
// UPDATE EMPLOYEE
// ==========================================

async function updateEmployee() {

    message.textContent =
        "Updating employee...";

    message.style.color =
        "#2563eb";


    const employeeData = {

        firstName:
            document.getElementById(
                "firstName"
            ).value.trim(),

        lastName:
            document.getElementById(
                "lastName"
            ).value.trim(),

        phone:
            document.getElementById(
                "phone"
            ).value.trim(),

        department:
            document.getElementById(
                "department"
            ).value,

        designation:
            document.getElementById(
                "designation"
            ).value.trim(),

        joiningDate:
            document.getElementById(
                "joiningDate"
            ).value,

        salary:
            Number(
                document.getElementById(
                    "salary"
                ).value
            ),

        status:
            document.getElementById(
                "status"
            ).value

    };


    try {

        const response =
            await fetch(
                `${API_URL}/${editEmployeeId}`,
                {
                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            employeeData
                        )
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Employee update failed"
            );

        }


        message.textContent =
            "✅ Employee updated successfully!";

        message.style.color =
            "#15803d";


        await loadEmployees();


        setTimeout(
            function() {

                closeModal();

            },
            1000
        );


    }
    catch(error) {

        console.error(
            "UPDATE EMPLOYEE ERROR:",
            error
        );


        message.textContent =
            "❌ " +
            (
                error.message ||
                "Unable to update employee"
            );

        message.style.color =
            "#dc2626";

    }

}


// ==========================================
// FORMAT DATE
// ==========================================

function formatDate(
    value
) {

    const date =
        new Date(value);


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return value;

    }


    return date.toLocaleDateString(
        "en-IN"
    );

}


// ==========================================
// DATE FOR INPUT
// ==========================================

function getDateForInput(
    value
) {

    if (!value) {

        return "";

    }


    const date =
        new Date(value);


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return "";

    }


    const year =
        date.getFullYear();


    const month =
        String(
            date.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        );


    return `${year}-${month}-${day}`;

}


// ==========================================
// ESCAPE HTML
// ==========================================

function escapeHTML(
    value
) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


// ==========================================
// INITIAL LOAD
// ==========================================

loadEmployees();
