<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SmartHR | Performance</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f6f8fb;
            color: #1f2937;
        }

        .page {
            padding: 30px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .page-header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .page-header p {
            color: #6b7280;
        }

        .btn {
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            margin-bottom: 25px;
        }

        .card h2 {
            margin-bottom: 18px;
            font-size: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: 600;
            font-size: 14px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2563eb;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .score-grid {
            display: grid;
            grid-template-columns:
                repeat(4, minmax(0, 1fr));
            gap: 12px;
        }

        .overall-box {
            margin-top: 18px;
            padding: 15px;
            background: #eff6ff;
            border-radius: 8px;
            font-weight: bold;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        th,
        td {
            padding: 13px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
            font-size: 14px;
        }

        th {
            background: #f9fafb;
            font-weight: 700;
        }

        .score {
            font-weight: bold;
        }

        .score.good {
            color: #16a34a;
        }

        .score.average {
            color: #d97706;
        }

        .score.low {
            color: #dc2626;
        }

        .delete-btn {
            border: none;
            background: #fee2e2;
            color: #dc2626;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        .message {
            margin-bottom: 15px;
            padding: 11px 14px;
            border-radius: 7px;
            display: none;
        }

        .message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .back-btn {
            text-decoration: none;
            color: #2563eb;
            font-weight: 600;
        }

        @media (max-width: 800px) {

            .form-grid,
            .score-grid {
                grid-template-columns: 1fr;
            }

            .page {
                padding: 18px;
            }

        }

    </style>

</head>


<body>

    <main class="page">

        <div class="page-header">

            <div>

                <a
                    href="hr.html"
                    class="back-btn"
                >
                    ← Back to Dashboard
                </a>

                <h1>
                    Performance Management
                </h1>

                <p>
                    Track and manage employee performance reviews.
                </p>

            </div>

        </div>


        <!-- =====================================
             MESSAGE
        ====================================== -->

        <div
            id="message"
            class="message"
        ></div>


        <!-- =====================================
             ADD PERFORMANCE
        ====================================== -->

        <section class="card">

            <h2>
                <i class="fa-solid fa-chart-line"></i>
                Add Performance Review
            </h2>


            <form id="performanceForm">

                <div class="form-grid">

                    <div class="form-group">

                        <label>
                            Employee
                        </label>

                        <select
                            id="employee_id"
                            required
                        >

                            <option value="">
                                Select Employee
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>
                            Review Period
                        </label>

                        <input
                            type="text"
                            id="review_period"
                            placeholder="Example: Q3 2026"
                            required
                        >

                    </div>

                </div>


                <br>


                <label>
                    Performance Scores
                </label>

                <div class="score-grid">

                    <div class="form-group">

                        <label>
                            Goals
                        </label>

                        <input
                            type="number"
                            id="goals_score"
                            min="0"
                            max="100"
                            value="0"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Productivity
                        </label>

                        <input
                            type="number"
                            id="productivity_score"
                            min="0"
                            max="100"
                            value="0"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Quality
                        </label>

                        <input
                            type="number"
                            id="quality_score"
                            min="0"
                            max="100"
                            value="0"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Teamwork
                        </label>

                        <input
                            type="number"
                            id="teamwork_score"
                            min="0"
                            max="100"
                            value="0"
                            required
                        >

                    </div>

                </div>


                <div class="overall-box">

                    Overall Score:
                    <span id="overallPreview">
                        0
                    </span>
                    / 100

                </div>


                <br>


                <div class="form-group">

                    <label>
                        Manager Comment
                    </label>

                    <textarea
                        id="manager_comment"
                        placeholder="Enter manager feedback..."
                    ></textarea>

                </div>


                <br>


                <button
                    type="submit"
                    class="btn btn-primary"
                >

                    <i class="fa-solid fa-save"></i>

                    Save Performance

                </button>

            </form>

        </section>


        <!-- =====================================
             PERFORMANCE RECORDS
        ====================================== -->

        <section class="card">

            <h2>
                Performance Records
            </h2>

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Employee
                            </th>

                            <th>
                                Department
                            </th>

                            <th>
                                Review Period
                            </th>

                            <th>
                                Goals
                            </th>

                            <th>
                                Productivity
                            </th>

                            <th>
                                Quality
                            </th>

                            <th>
                                Teamwork
                            </th>

                            <th>
                                Overall
                            </th>

                            <th>
                                Comment
                            </th>

                            <th>
                                Action
                            </th>

                        </tr>

                    </thead>

                    <tbody
                        id="performanceTableBody"
                    >

                        <tr>

                            <td
                                colspan="10"
                                style="text-align:center;"
                            >
                                Loading...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <script src="performance.js"></script>

</body>

</html>
