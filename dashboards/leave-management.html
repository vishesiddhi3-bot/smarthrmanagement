<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SmartHR | Leave Management</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        .topbar {
            height: 75px;
            background: white;
            border-bottom: 1px solid #e5e7eb;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 35px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: #2563eb;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand strong {
            font-size: 20px;
        }

        .brand small {
            display: block;
            color: #64748b;
            margin-top: 2px;
        }

        .back-btn,
        .refresh-btn {
            border: none;
            padding: 10px 16px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 600;
        }

        .back-btn {
            background: #eef2ff;
            color: #2563eb;
        }

        .refresh-btn {
            background: #2563eb;
            color: white;
        }

        .content {
            padding: 30px 35px;
        }

        .heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .heading h1 {
            font-size: 28px;
        }

        .heading p {
            color: #64748b;
            margin-top: 6px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .stat {
            background: white;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0,0,0,.05);
        }

        .stat span {
            display: block;
            color: #64748b;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .stat strong {
            font-size: 25px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 4px 18px rgba(0,0,0,.05);
        }

        .filters {
            display: grid;
            grid-template-columns: 2fr 1fr auto;
            gap: 12px;
            margin-bottom: 20px;
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            padding: 18px;
            border-radius: 12px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter-group label {
            font-size: 12px;
            font-weight: 700;
            color: #475569;
        }

        input,
        select {
            padding: 11px 12px;
            border: 1px solid #dbe1e8;
            border-radius: 8px;
            background: white;
            outline: none;
        }

        .reset-btn {
            border: none;
            background: #e2e8f0;
            padding: 11px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .message {
            display: none;
            padding: 12px 15px;
            border-radius: 9px;
            margin-bottom: 18px;
            font-weight: 600;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: #dcfce7;
            color: #15803d;
        }

        .message.error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 1200px;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #edf0f4;
        }

        th {
            background: #f8fafc;
            color: #475569;
            font-size: 12px;
        }

        td {
            font-size: 14px;
        }

        .employee-name {
            font-weight: 700;
        }

        .employee-code {
            color: #2563eb;
            font-size: 12px;
            margin-top: 3px;
        }

        .reason {
            max-width: 220px;
            white-space: normal;
            color: #475569;
        }

        .days {
            font-weight: 800;
            color: #2563eb;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .status.pending {
            background: #fef3c7;
            color: #b45309;
        }

        .status.approved {
            background: #dcfce7;
            color: #15803d;
        }

        .status.rejected {
            background: #fee2e2;
            color: #b91c1c;
        }

        .actions {
            display: flex;
            gap: 7px;
        }

        .approve-btn,
        .reject-btn {
            border: none;
            padding: 8px 10px;
            border-radius: 7px;
            color: white;
            cursor: pointer;
            font-weight: 700;
        }

        .approve-btn {
            background: #16a34a;
        }

        .reject-btn {
            background: #dc2626;
        }

        .approve-btn:hover {
            background: #15803d;
        }

        .reject-btn:hover {
            background: #b91c1c;
        }

        .processed {
            color: #94a3b8;
            font-size: 13px;
        }

        .empty {
            text-align: center;
            padding: 45px !important;
            color: #64748b;
        }

        @media (max-width: 900px) {

            .stats {
                grid-template-columns: 1fr 1fr;
            }

            .filters {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 600px) {

            .content {
                padding: 20px;
            }

            .topbar {
                padding: 0 20px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .brand small {
                display: none;
            }

        }

    </style>

</head>

<body>

<header class="topbar">

    <div class="brand">

        <div class="brand-icon">
            <i class="fa-solid fa-calendar-check"></i>
        </div>

        <div>
            <strong>SmartHR</strong>

            <small>
                Leave Management
            </small>
        </div>

    </div>

    <button
        class="back-btn"
        onclick="goBack()"
    >
        <i class="fa-solid fa-arrow-left"></i>
        Dashboard
    </button>

</header>


<main class="content">

    <div class="heading">

        <div>
            <h1>Leave Management</h1>

            <p>
                Review and manage employee leave requests.
            </p>
        </div>

        <button
            class="refresh-btn"
            id="refreshBtn"
        >
            <i class="fa-solid fa-rotate"></i>
            Refresh
        </button>

    </div>


    <!-- STATS -->

    <section class="stats">

        <div class="stat">
            <span>Total Requests</span>
            <strong id="totalCount">0</strong>
        </div>

        <div class="stat">
            <span>Pending</span>
            <strong id="pendingCount">0</strong>
        </div>

        <div class="stat">
            <span>Approved</span>
            <strong id="approvedCount">0</strong>
        </div>

        <div class="stat">
            <span>Rejected</span>
            <strong id="rejectedCount">0</strong>
        </div>

    </section>


    <div class="card">

        <!-- FILTER -->

        <div class="filters">

            <div class="filter-group">

                <label>
                    Search Employee
                </label>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search name or employee ID..."
                >

            </div>


            <div class="filter-group">

                <label>
                    Status
                </label>

                <select id="statusFilter">

                    <option value="">
                        All Status
                    </option>

                    <option value="pending">
                        Pending
                    </option>

                    <option value="approved">
                        Approved
                    </option>

                    <option value="rejected">
                        Rejected
                    </option>

                </select>

            </div>


            <button
                class="reset-btn"
                id="resetBtn"
            >
                Reset
            </button>

        </div>


        <div
            class="message"
            id="message"
        ></div>


        <!-- TABLE -->

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>EMPLOYEE</th>

                        <th>LEAVE TYPE</th>

                        <th>START DATE</th>

                        <th>END DATE</th>

                        <th>DAYS</th>

                        <th>REASON</th>

                        <th>STATUS</th>

                        <th>ACTION</th>

                    </tr>

                </thead>

                <tbody id="leaveTableBody">

                    <tr>

                        <td
                            colspan="8"
                            class="empty"
                        >
                            Loading leave requests...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</main>


<script src="leave-management.js"></script>

</body>

</html>
