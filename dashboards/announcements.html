<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SmartHR | Announcements</title>

    <link
        rel="stylesheet"
        href="announcements.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body>

    <div class="page">

        <!-- =========================================
             TOP BAR
        ========================================== -->

        <header class="topbar">

            <div class="page-title">

                <div class="title-icon">
                    <i class="fa-solid fa-bullhorn"></i>
                </div>

                <div>

                    <h1>Announcements</h1>

                    <p>
                        Share important updates and company news
                    </p>

                </div>

            </div>


            <button
                class="back-btn"
                onclick="goBack()"
            >

                <i class="fa-solid fa-arrow-left"></i>

                Back to Dashboard

            </button>

        </header>


        <!-- =========================================
             STATISTICS
        ========================================== -->

        <section class="stats-grid">

            <div class="stat-card">

                <div class="stat-icon blue">

                    <i class="fa-solid fa-bullhorn"></i>

                </div>

                <div class="stat-content">

                    <span>Total Announcements</span>

                    <strong id="totalAnnouncements">
                        0
                    </strong>

                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon green">

                    <i class="fa-solid fa-calendar-check"></i>

                </div>

                <div class="stat-content">

                    <span>Latest Announcement</span>

                    <strong id="latestAnnouncement">
                        -
                    </strong>

                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon purple">

                    <i class="fa-solid fa-user-tie"></i>

                </div>

                <div class="stat-content">

                    <span>Published By</span>

                    <strong id="latestPublisher">
                        -
                    </strong>

                </div>

            </div>

        </section>


        <!-- =========================================
             CREATE ANNOUNCEMENT
        ========================================== -->

        <section class="card">

            <div class="card-header">

                <div>

                    <h2>
                        <i class="fa-solid fa-pen-to-square"></i>
                        Create Announcement
                    </h2>

                    <p>
                        Publish an important message for employees
                    </p>

                </div>

            </div>


            <form id="announcementForm">

                <div class="form-grid">

                    <!-- TITLE -->

                    <div class="form-group">

                        <label for="title">
                            Announcement Title
                        </label>

                        <div class="input-wrapper">

                            <i class="fa-solid fa-heading"></i>

                            <input
                                type="text"
                                id="title"
                                placeholder="Enter announcement title"
                                maxlength="150"
                                required
                            >

                        </div>

                    </div>


                    <!-- MESSAGE -->

                    <div class="form-group full">

                        <label for="message">
                            Announcement Message
                        </label>

                        <textarea
                            id="message"
                            rows="6"
                            maxlength="2000"
                            placeholder="Write your announcement here..."
                            required
                        ></textarea>

                        <div class="character-count">

                            <span id="characterCount">
                                0
                            </span>

                            / 2000

                        </div>

                    </div>

                </div>


                <!-- FORM ACTIONS -->

                <div class="form-actions">

                    <button
                        type="reset"
                        class="clear-btn"
                    >

                        <i class="fa-solid fa-rotate-left"></i>

                        Clear

                    </button>


                    <button
                        type="submit"
                        class="publish-btn"
                        id="publishBtn"
                    >

                        <i class="fa-solid fa-paper-plane"></i>

                        Publish Announcement

                    </button>

                </div>

            </form>


            <div
                id="formMessage"
                class="form-message"
            ></div>

        </section>


        <!-- =========================================
             ANNOUNCEMENT RECORDS
        ========================================== -->

        <section class="card">

            <div class="card-header">

                <div>

                    <h2>
                        <i class="fa-solid fa-newspaper"></i>
                        Announcement Records
                    </h2>

                    <p>
                        Recently published announcements
                    </p>

                </div>


                <button
                    class="refresh-btn"
                    onclick="loadAnnouncements()"
                >

                    <i class="fa-solid fa-rotate"></i>

                    Refresh

                </button>

            </div>


            <div
                id="announcementList"
                class="announcement-list"
            >

                <div class="loading">

                    <i class="fa-solid fa-spinner fa-spin"></i>

                    Loading announcements...

                </div>

            </div>

        </section>

    </div>


    <script src="announcements.js"></script>

</body>

</html>
